version: '3.8'

services:
  ludwig-pipeline:
    build: .
    container_name: ludwig-ml-pipeline
    volumes:
      - ./data:/app/data
      - ./artifacts:/app/artifacts
      - ./results:/app/results
      - ./logs:/app/logs
    environment:
      - PYTHONUNBUFFERED=1
    # Resource limits (optimized for 16GB RAM, 8 CPUs)
    deploy:
      resources:
        limits:
          cpus: '6'
          memory: 12G
        reservations:
          cpus: '2'
          memory: 4G
    restart: unless-stopped
    networks:
      - ludwig-network

  # MinIO for artifact storage
  minio:
    image: minio/minio:latest
    container_name: ludwig-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - ludwig-network

  # MLflow for experiment tracking
  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    container_name: ludwig-mlflow
    ports:
      - "5000:5000"
    environment:
      - BACKEND_URI=sqlite:///mlflow.db
      - ARTIFACT_ROOT=s3://mlflow
      - AWS_ACCESS_KEY_ID=minio
      - AWS_SECRET_ACCESS_KEY=minio123
      - MLFLOW_S3_ENDPOINT_URL=http://minio:9000
    command: >
      mlflow server --backend-store-uri sqlite:///mlflow.db --default-artifact-root s3://mlflow --host 0.0.0.0 --port 5000
    volumes:
      - mlflow-data:/mlflow
    depends_on:
      - minio
    networks:
      - ludwig-network

networks:
  ludwig-network:
    driver: bridge

volumes:
  minio-data:
  mlflow-data:
