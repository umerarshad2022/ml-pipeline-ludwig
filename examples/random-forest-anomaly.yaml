name: DU Cell Anomaly Detection with Random Forest
description: Lightweight Random Forest classifier for anomaly detection in DU cell metrics
metadata:
 author: AIML Team
 version: 1.0.0
 created: 2026-02-07
 model_type: random_forest

data:
 preprocessing:
   drop_columns:
     - Cell_ID
     - gNB_ID
     - Timestamp

sklearn_model:
  type: random_forest
  params:
    n_estimators: 100          # Number of trees in the forest
    max_depth: 10              # Maximum depth of the tree
    min_samples_split: 5       # Minimum samples required to split a node
    min_samples_leaf: 2        # Minimum samples required at a leaf node
    max_features: sqrt         # Number of features to consider for split
    random_state: 42
    n_jobs: -1                 # Use all CPU cores
    class_weight: balanced     # Handle class imbalance
  input_features:
    - active_users
  output_feature: is_anomaly

steps:
 - name: load-data
   type: data_loader
   config:
     source:
       type: csv
       path: data/sample_data.csv

 - name: auto-label-anomalies
   type: unsupervised_labeling
   config:
     method: isolation_forest
     contamination: 0.10
     feature: active_users
     output_column: is_anomaly

 - name: train-sklearn
   type: sklearn_train
   config:
     model_type: random_forest
     output_directory: artifacts/random_forest_model
     experiment_name: du-cell-rf-anomaly

 - name: evaluate
   type: sklearn_evaluate
   config:
     output_directory: artifacts/evaluation

 - name: visualize
   type: sklearn_visualize
   config:
     visualizations:
       - feature_importance
       - confusion_matrix
       - roc_curve
       - precision_recall_curve
     output_directory: artifacts/visualizations

 - name: xai
   type: sklearn_xai
   config:
     methods:
       - shap
       - lime
     n_lime: 3
     output_directory: artifacts/random_forest_model/xai
