name: DU Cell Anomaly Detection with Ludwig
description: Deep learning-based anomaly detection for DU cell metrics using Ludwig AI
metadata:
 author: AIML Team
 version: 1.0.0
 created: 2026-01-28
data:
 preprocessing:
   drop_columns:
     - Cell_ID
     - gNB_ID
     - Timestamp
ludwig:
 input_features:
   - name: active_users
     type: numerical
     preprocessing:
       normalization: zscore
 output_features:
   - name: is_anomaly
     type: binary
     loss:
       type: binary_weighted_cross_entropy
       class_weights: [1, 10]
 trainer:
   epochs: 100
   batch_size: 32
   learning_rate: 0.001
   optimizer:
     type: adam
   decay: true
   decay_steps: 10000
   decay_rate: 0.96
   early_stop: 10
   validation_metric: accuracy
   validation_field: is_anomaly
   learning_rate_scheduler:
     type: reduce_on_plateau
     factor: 0.5
     patience: 5
 defaults:
   numerical:
     preprocessing:
       missing_value_strategy: fill_with_mean
       normalization: zscore
   binary:
     preprocessing:
       fallback_label: 0
steps:
 - name: load-data
   type: data_loader
   config:
     source:
       type: csv
       path: data/sample_data.csv
 - name: auto-label-anomalies
   type: unsupervised_labeling
   config:
     method: isolation_forest
     contamination: 0.10
     feature: active_users
     output_column: is_anomaly
 - name: train-ludwig
   type: ludwig_train
   config:
     output_directory: artifacts/ludwig_model
     experiment_name: du-cell-anomaly
 - name: evaluate
   type: ludwig_evaluate
   config:
     output_directory: artifacts/evaluation
 - name: visualize
   type: ludwig_visualize
   config:
     visualizations:
       - learning_curves
       - confusion_matrix
       - roc_curve
     output_directory: artifacts/visualizations
